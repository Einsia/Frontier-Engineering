api_version: benchgen/v1
benchmark_id: Cybersecurity/DependencyAwarePatchScheduling
title: Dependency-Aware Cybersecurity Patch Scheduling
summary: An offline structured-solution benchmark in which a solver selects patches
  and assigns integer start slots over a finite planning horizon. Each deterministic
  instance specifies vulnerabilities, affected assets, patch coverage, patch prerequisites,
  asset and service relationships, time-varying exploit probabilities, monetary impact
  and criticality values, maintenance windows, patch durations, renewable resource
  demands, service downtime limits, and rollback probabilities and costs. The candidate
  output is a JSON patch schedule; omitted patches remain unapplied. Instances are
  generated reproducibly from a published fixed seed set, with small, medium, and
  large tiers spanning sparse and dense dependency graphs, constrained maintenance
  calendars, resource bottlenecks, and competing security and operational costs.
archetype: structured-solution
