title: 带碰撞与载重约束的多仓储机器人路径规划
summary: 给定离散仓库通行图、机器人初始位置、载重上限、规划时域，以及包含取货点、送货点和货物重量的订单，参赛系统输出每台机器人的逐时刻路径与取送货动作。实例覆盖不同仓库布局、机器人密度、订单规模和拥堵程度，并以全部订单完成后的机器人总移动距离衡量方案质量。
