design:
  problem_setting: offline_batch
  arrival_model: All analytics-query portfolios are generated deterministically from
    fixed seeds before solving. A candidate receives a complete static instance containing
    query sensitivities, business values, population coverage, group memberships,
    bounds, fairness thresholds, accuracy requirements, and total budget, then returns
    one structured allocation for that instance.
  objective_rationale: The primary objective is appropriate because privacy budget
    is a scarce resource and the economically relevant decision is the feasible allocation
    that preserves the most weighted analytics utility while controlling estimation
    error. Accuracy and fairness are hard feasibility requirements so the objective
    cannot trade them away beyond accepted policy limits.
  literature_alignment: The supplied brief aligns with differential-privacy budget-allocation
    work at the level of allocating limited privacy loss across multiple analytics
    queries and recomputing privacy loss and error from first principles. This benchmark
    differs by making the task an offline batch portfolio optimization problem with
    explicit business values, population coverage, fairness constraints, and a structured
    candidate output rather than an interactive privacy accountant or a single-query
    mechanism design task.
objective:
  raw_metric: 'Verifier-owned positive raw utility: 1.0 plus the sum over queries
    of business_value * population_coverage * log1p(epsilon) minus deterministic error
    penalties, evaluated only after all feasibility checks pass.'
  direction: maximize
  aggregation: mean
  normalization: log2_baseline_ratio
  invalid_score: -1.0e+18
