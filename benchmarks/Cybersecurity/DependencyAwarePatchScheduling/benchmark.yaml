design:
  problem_setting: offline_batch
  arrival_model: 'Each instance is a static planning batch: the complete vulnerability
    set, patch catalog, dependency graph, asset and service data, exploit-probability
    curves, capacities, maintenance windows, durations, and cost parameters are revealed
    before a schedule is submitted. No vulnerabilities, windows, or capacity changes
    arrive during execution. Benchmark instances are regenerated deterministically
    from fixed seeds, and the seed does not change in response to candidate behavior.'
  objective_rationale: Expected monetary loss is appropriate because patching is not
    valuable merely for maximizing patch count or minimizing completion time. It prices
    the security exposure retained by delaying or omitting patches while also charging
    for the business disruption and rollback exposure caused by applying them. Expressing
    all three components in a common monetary unit produces a continuous, auditable
    tradeoff and keeps feasibility rules separate from preferences. The raw objective
    is strictly lower-is-better and can be kept positive through instance construction,
    making it suitable for framework-owned log2_baseline_ratio normalization.
  literature_alignment: NIST SP 800-40 Rev. 4 frames enterprise patching as risk-based
    preventive maintenance that must be planned alongside operational constraints.
    CISA BOD 22-01 provides a concrete basis for prioritizing vulnerabilities with
    evidence of active exploitation and for modeling remediation deadlines. This benchmark
    turns those planning principles into a deterministic offline optimization problem;
    its synthetic monetary loss, rollback, resource, and downtime parameters are benchmark
    abstractions rather than values claimed by either source. It differs from classical
    makespan scheduling by allowing economically rational patch omission and by jointly
    enforcing dependency closure, maintenance calendars, renewable resources, and
    service downtime limits.
