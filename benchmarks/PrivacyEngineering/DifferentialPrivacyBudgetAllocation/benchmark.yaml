benchmark_id: PrivacyEngineering/DifferentialPrivacyBudgetAllocation
title: Differential Privacy Budget Allocation for Business Analytics
summary: Allocate a fixed differential-privacy budget across analytics queries with
  heterogeneous sensitivity, business value, population coverage, fairness requirements,
  and estimation-accuracy needs. Candidate solutions return a structured per-query
  budget allocation that is checked against deterministic benchmark instances generated
  from fixed seeds.
